<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gruzzolo</title>
<meta name="description" content="Il tuo portafoglio di investimenti: valore, rendimenti, dividendi, costi e rischio, solo per te.">
<meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0e12" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gruzzolo">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Manrope:wght@400;500;600;700;800&display=swap" crossorigin>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/portfolio.css">
<link rel="stylesheet" href="css/report.css">
<link rel="stylesheet" href="css/report2.css">
<link rel="stylesheet" href="css/extra.css">
</head>
<body>
<!-- APP:BODY:START -->
<script>
  // Apply the saved theme before the first paint (no light/dark flash)
  (function () {
    try {
      var t = localStorage.getItem('gruzzolo:theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* storage unavailable */ }
  })();
</script>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Menu principale">
    <div class="side-brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="var(--accent)"/><path d="M21.2 11.2A6.6 6.6 0 1 0 21.2 20.8M8.6 14.4h9M8.6 17.6h9" fill="none" stroke="var(--accent-ink)" stroke-width="2.4" stroke-linecap="round"/></svg>
      <span>Gruzzolo</span>
    </div>
    <nav class="side-nav" id="side-nav" aria-label="Sezioni"></nav>
    <div class="side-add" id="side-add"></div>
    <div class="side-foot" id="side-status" aria-live="polite"></div>
  </aside>

  <div class="shell">
    <header class="top" id="top">
      <div class="top-inner">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="var(--accent)"/><path d="M21.2 11.2A6.6 6.6 0 1 0 21.2 20.8M8.6 14.4h9M8.6 17.6h9" fill="none" stroke="var(--accent-ink)" stroke-width="2.4" stroke-linecap="round"/></svg>
          <div class="brand-text">
            <span class="brand-name">Gruzzolo</span>
            <span class="brand-status" id="top-status"></span>
          </div>
        </div>
        <div class="top-crumb" id="top-crumb"></div>
        <div class="top-spacer"></div>
        <div class="top-actions" id="top-actions"></div>
      </div>
    </header>

    <main id="view" tabindex="-1">
      <div class="boot" aria-busy="true">
        <p class="boot-text">Carico il tuo portafoglio…</p>
        <div class="skeleton skel-line" style="width: 38%"></div>
        <div class="skeleton skel-title"></div>
        <div class="skeleton skel-block"></div>
        <div class="skeleton skel-line"></div>
        <div class="skeleton skel-line" style="width: 72%"></div>
      </div>
      <noscript><p class="noscript">Per usare Gruzzolo attiva JavaScript nel browser.</p></noscript>
    </main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Sezioni"></nav>
</div>

<div class="sheet-layer" id="sheet-layer" hidden>
  <div class="backdrop" data-act="close-sheet"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
    <div class="grab" aria-hidden="true"></div>
    <div class="sheet-head">
      <button class="icon-btn back" id="sheet-back" type="button" data-act="back-sheet" aria-label="Indietro" hidden></button>
      <h2 id="sheet-title"></h2>
      <button class="icon-btn" id="sheet-close" type="button" data-act="close-sheet" aria-label="Chiudi"></button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="import-file" data-input="more-import-file" accept=".json,.csv,.txt,application/json,text/csv" hidden>

<script>
  // Start-up guard: if the app code cannot load or crashes before starting,
  // show a readable message instead of an empty page.
  (function () {
    var shown = false;
    function show(msg) {
      if (shown || window.__gruzzoloStarted) return;
      var v = document.getElementById('view');
      if (!v) return;
      shown = true;
      v.innerHTML = '<div class="boot-error" role="alert"><strong>Gruzzolo non riesce ad avviarsi</strong><p></p><button class="btn primary" type="button">Riprova</button></div>';
      v.querySelector('p').textContent = msg;
      v.querySelector('button').onclick = function () { location.reload(); };
    }
    window.addEventListener('error', function (e) {
      var t = e && e.target;
      if (t && t.tagName === 'SCRIPT') show('Un file dell\'app non si è caricato (' + (t.src || 'script') + '). Controlla la connessione e riprova.');
      else if (!t || t === window) show('Errore: ' + ((e && e.message) || 'sconosciuto'));
    }, true);
    setTimeout(function () {
      show('L\'avvio sta impiegando troppo tempo. Controlla la connessione e riprova.');
    }, 20000);
  })();
</script>
<!-- APP:BODY:END -->
<script type="module" src="js/main.js"></script>
</body>
</html>
