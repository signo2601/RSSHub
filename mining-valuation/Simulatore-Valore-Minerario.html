<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Simulatore Valore Minerario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a data pane (tabs of inputs) beside a results pane; one pane at a time on phones. */
:root {
    --bg: #f1f2ee;
    --surface: #ffffff;
    --surface-2: #f6f7f3;
    --ink: #1a1e1b;
    --ink-2: #4a524c;
    --muted: #747c76;
    --line: #dadcd5;
    --line-strong: #bfc4bb;
    --accent: #0f6b61;
    --accent-ink: #ffffff;
    --accent-soft: #dcefeb;
    --good: #1b7a45;
    --good-soft: #dcf0e4;
    --warn: #8f5500;
    --warn-soft: #f7ebd0;
    --bad: #b3261e;
    --bad-soft: #f8dcd9;
    --focus: #2a78d6;
    --s1: #2a78d6;
    --s2: #eb6834;
    --s3: #1baf7a;
    --s4: #eda100;
    --s5: #e87ba4;
    --s6: #008300;
    --s7: #6250d6;
    --s8: #e34948;
    --font-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
        --bg: #111412;
        --surface: #181c19;
        --surface-2: #1e2320;
        --ink: #e8ebe6;
        --ink-2: #b4bcb5;
        --muted: #88918a;
        --line: #2a312c;
        --line-strong: #3b453e;
        --accent: #55b9a9;
        --accent-ink: #06201c;
        --accent-soft: #19332f;
        --good: #5ac584;
        --good-soft: #17301f;
        --warn: #e0a64a;
        --warn-soft: #34290f;
        --bad: #ee7b73;
        --bad-soft: #3a1b19;
        --focus: #6aa8f0;
        --s1: #3987e5;
        --s2: #d95926;
        --s3: #199e70;
        --s4: #c98500;
        --s5: #d55181;
        --s6: #008300;
        --s7: #9085e9;
        --s8: #e66767;
        color-scheme: dark;
    }
}

:root[data-theme='dark'] {
    --bg: #111412;
    --surface: #181c19;
    --surface-2: #1e2320;
    --ink: #e8ebe6;
    --ink-2: #b4bcb5;
    --muted: #88918a;
    --line: #2a312c;
    --line-strong: #3b453e;
    --accent: #55b9a9;
    --accent-ink: #06201c;
    --accent-soft: #19332f;
    --good: #5ac584;
    --good-soft: #17301f;
    --warn: #e0a64a;
    --warn-soft: #34290f;
    --bad: #ee7b73;
    --bad-soft: #3a1b19;
    --focus: #6aa8f0;
    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;
    --s4: #c98500;
    --s5: #d55181;
    --s6: #008300;
    --s7: #9085e9;
    --s8: #e66767;
    color-scheme: dark;
}

* {
    box-sizing: border-box;
}

[hidden] {
    display: none !important;
}

html {
    -webkit-text-size-adjust: 100%;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.45;
    padding-block: 0 32px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
}

h1,
h2,
h3,
h4,
p {
    margin: 0;
}

button,
input,
select,
textarea {
    font: inherit;
    color: inherit;
}

:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
}

.topbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-block: 18px 10px;
    max-width: 1680px;
    margin-inline: auto;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
}

.mark {
    width: 34px;
    height: 34px;
    flex: none;
    color: var(--accent);
}

.brand h1 {
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -0.01em;
    text-wrap: balance;
}

.brand p {
    color: var(--muted);
    font-size: 13px;
    max-width: 62ch;
}

.toolbar-wrap {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 14px;
    max-width: 1680px;
    margin-inline: auto;
    padding-bottom: 12px;
}

.toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
}

.toolbar-sep {
    width: 1px;
    height: 20px;
    background: var(--line-strong);
    margin-inline: 4px;
}

.status {
    color: var(--accent);
    font-weight: 500;
    min-height: 1.4em;
}

.btn {
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--accent-ink);
    border-radius: 6px;
    padding: 8px 14px;
    cursor: pointer;
    font-weight: 500;
    line-height: 1.2;
}

.btn.small {
    padding: 6px 10px;
    font-size: 13px;
}

.btn.ghost {
    background: transparent;
    color: var(--ink);
    border-color: var(--line-strong);
}

.btn:hover {
    filter: brightness(1.06);
}

.btn.ghost:hover {
    background: var(--surface-2);
    filter: none;
}

.icon-btn {
    border: 0;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    padding: 2px 6px;
    border-radius: 4px;
}

.icon-btn:hover {
    color: var(--bad);
    background: var(--bad-soft);
}

.paste-panel {
    max-width: 1680px;
    margin: 0 auto 12px;
    display: grid;
    gap: 8px;
}

.paste-panel textarea,
.sr-fallback {
    width: 100%;
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    background: var(--surface);
    padding: 8px;
    font-family: var(--font-mono);
    font-size: 12px;
}

.sr-fallback {
    position: fixed;
    left: -9999px;
}

.row {
    display: flex;
    gap: 8px;
}

.segmented {
    display: inline-flex;
    border: 1px solid var(--line-strong);
    border-radius: 7px;
    overflow: hidden;
    background: var(--surface);
}

.segmented button {
    border: 0;
    background: transparent;
    padding: 7px 16px;
    cursor: pointer;
}

.segmented button.on {
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 500;
}

.segmented.small button {
    padding: 5px 12px;
    font-size: 13px;
}

.view-switch {
    display: none;
}

.layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 20px;
    align-items: start;
    max-width: 1680px;
    margin-inline: auto;
}

.pane {
    min-width: 0;
}

.stack {
    display: grid;
    gap: 14px;
    min-width: 0;
}

.tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 2px;
    border-bottom: 1px solid var(--line-strong);
    margin-bottom: 14px;
}

.tabs button {
    border: 0;
    background: transparent;
    padding: 9px 12px;
    cursor: pointer;
    color: var(--ink-2);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    font-weight: 500;
}

.tabs button.on {
    color: var(--accent);
    border-bottom-color: var(--accent);
}

.card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
    display: grid;
    gap: 12px;
    min-width: 0;
}

.card-head {
    display: grid;
    gap: 3px;
}

.card-head h3,
.summary-title {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.005em;
    text-wrap: balance;
}

.card-head p,
.muted {
    color: var(--ink-2);
    font-size: 13px;
    max-width: 78ch;
}

.field-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 12px 14px;
}

.field {
    display: grid;
    gap: 4px;
    align-content: start;
    min-width: 0;
}

.field-wide {
    grid-column: 1 / -1;
}

.field-label {
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-2);
    letter-spacing: 0.01em;
}

.field-hint {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.35;
}

.field-control {
    display: flex;
    align-items: center;
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    background: var(--surface);
    min-width: 0;
}

.field-control:focus-within {
    border-color: var(--focus);
    outline: 1px solid var(--focus);
}

.field-control input {
    flex: 1;
    min-width: 0;
    border: 0;
    background: transparent;
    padding: 8px 10px;
    font-variant-numeric: tabular-nums;
    outline: none;
}

.field-suffix {
    padding-right: 10px;
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
}

.check {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    grid-column: 1 / -1;
}

.check input {
    margin-top: 3px;
    accent-color: var(--accent);
}

.check > span {
    display: grid;
    gap: 2px;
}

.table-scroll {
    overflow-x: auto;
    max-width: 100%;
    border: 1px solid var(--line);
    border-radius: 6px;
}

table {
    border-collapse: collapse;
    width: 100%;
}

th,
td {
    font-variant-numeric: tabular-nums;
}

.grid {
    min-width: 760px;
}

.grid th,
.grid td {
    border-bottom: 1px solid var(--line);
    padding: 0;
    text-align: right;
    white-space: nowrap;
}

.grid thead th {
    background: var(--surface-2);
    vertical-align: bottom;
    padding: 8px 6px;
    font-weight: 500;
    font-size: 12px;
    color: var(--ink-2);
    text-align: left;
    min-width: 96px;
}

.th-title {
    display: block;
    white-space: normal;
    line-height: 1.25;
}

.th-sub {
    display: grid;
    gap: 2px;
    margin-top: 6px;
    font-size: 11px;
    font-weight: 400;
    color: var(--muted);
}

.field-control.mini input {
    padding: 3px 6px;
    text-align: right;
    font-size: 12px;
}

.field-control.mini .field-suffix {
    padding-right: 6px;
}

.sticky-col {
    position: sticky;
    left: 0;
    background: var(--surface-2);
    z-index: 1;
    text-align: left !important;
    padding: 6px 10px !important;
    font-weight: 500;
    min-width: 56px !important;
}

.grid td input {
    width: 100%;
    min-width: 84px;
    border: 0;
    background: transparent;
    text-align: right;
    padding: 6px 8px;
    font-variant-numeric: tabular-nums;
    font-family: var(--font-mono);
    font-size: 12.5px;
}

.grid td input:focus {
    outline: 2px solid var(--focus);
    outline-offset: -2px;
    background: var(--surface-2);
}

.grid-total th,
.grid-total td {
    background: var(--surface-2);
    padding: 7px 8px !important;
    font-weight: 600;
    font-family: var(--font-mono);
    font-size: 12.5px;
}

.chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
}

.chip {
    display: inline-flex;
    align-items: center;
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    background: var(--surface);
}

.chip input {
    border: 0;
    background: transparent;
    padding: 6px 8px;
    width: 150px;
    outline: none;
}

.scenario-list {
    display: grid;
    gap: 12px;
}

.scenario {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
    display: grid;
    gap: 10px;
    background: var(--surface-2);
}

.scenario-head {
    display: flex;
    gap: 8px;
    align-items: center;
    justify-content: space-between;
}

.scenario-name {
    flex: 1;
    min-width: 0;
    border: 1px solid transparent;
    background: transparent;
    font-weight: 600;
    font-size: 15px;
    padding: 4px 6px;
    border-radius: 6px;
}

.scenario-name:hover,
.scenario-name:focus {
    border-color: var(--line-strong);
    background: var(--surface);
}

.asset-list {
    display: grid;
    gap: 12px;
}

.asset {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 10px 12px;
    align-items: end;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface-2);
}

.details > summary {
    cursor: pointer;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 12px;
    align-items: baseline;
}

.details[open] > summary {
    margin-bottom: 12px;
}

.summary-hint {
    color: var(--muted);
    font-size: 12px;
    font-family: var(--font-mono);
}

.mini-table th,
.mini-table td {
    padding: 4px 6px;
    border-bottom: 1px solid var(--line);
    text-align: left;
    font-size: 13px;
}

.mini-table th {
    background: var(--surface-2);
    font-weight: 500;
    font-size: 12px;
    color: var(--ink-2);
}

.mini-table td.num {
    text-align: right;
    font-family: var(--font-mono);
}

.mini-table input {
    width: 100%;
    min-width: 70px;
    border: 1px solid transparent;
    background: transparent;
    padding: 4px 6px;
    border-radius: 4px;
    font-variant-numeric: tabular-nums;
}

.mini-table input:hover,
.mini-table input:focus {
    border-color: var(--line-strong);
    background: var(--surface);
}

.estimator-foot {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 16px;
    align-items: center;
    justify-content: space-between;
}

.apply {
    display: inline-flex;
    gap: 6px;
    align-items: center;
}

select {
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    background: var(--surface);
    padding: 7px 8px;
    max-width: 100%;
}

/* results */
.results-inner {
    display: grid;
    gap: 14px;
    min-width: 0;
}

.selection-bar {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--bg);
    padding-block: 6px;
}

.selectors {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 14px;
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
}

.select-field {
    display: grid;
    gap: 3px;
    min-width: 0;
}

.select-field span {
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-2);
}

.kpis {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
}

.kpi {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    display: grid;
    gap: 3px;
    align-content: start;
    min-width: 0;
}

.kpi-label {
    font-size: 12px;
    color: var(--ink-2);
    font-weight: 500;
}

.kpi-value {
    font-family: var(--font-mono);
    font-size: 24px;
    font-weight: 500;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
}

.kpi-value.neg {
    color: var(--bad);
}

.kpi-note {
    font-size: 12px;
    color: var(--muted);
    overflow-wrap: anywhere;
}

.matrix-set {
    display: grid;
    gap: 16px;
    min-width: 0;
}

.matrix-group {
    display: grid;
    gap: 12px;
    min-width: 0;
}

.matrix-group.pair {
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
}

.matrix-group > div {
    min-width: 0;
    display: grid;
    gap: 6px;
    align-content: start;
}

h4 {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-2);
}

.matrix th,
.matrix td {
    padding: 7px 10px;
    border-bottom: 1px solid var(--line);
    text-align: left;
    white-space: nowrap;
}

.matrix thead th {
    background: var(--surface-2);
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-2);
}

.matrix th.num,
.matrix td.num {
    text-align: right;
    font-family: var(--font-mono);
    font-size: 12.5px;
}

.matrix tbody th {
    font-weight: 500;
}

.matrix td[title] {
    cursor: pointer;
}

.matrix td.selected {
    outline: 2px solid var(--ink);
    outline-offset: -2px;
    font-weight: 600;
}

.matrix tr.total th,
.matrix tr.total td {
    font-weight: 600;
    background: var(--surface-2);
}

.matrix tr.sep th {
    background: var(--surface-2);
    font-size: 12px;
    color: var(--ink-2);
    font-weight: 500;
}

.matrix.annual .sticky-col {
    background: var(--surface);
}

.matrix.annual tr.total .sticky-col {
    background: var(--surface-2);
}

.chart-pair {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr));
    gap: 14px;
    min-width: 0;
}

.chart-svg {
    width: 100%;
    height: auto;
    display: block;
    overflow: visible;
}

.chart-svg .tick,
.chart-svg .direct-label {
    font-size: 11px;
    fill: var(--ink-2);
    font-family: var(--font-body);
}

.chart-svg .direct-label {
    fill: var(--ink);
    font-weight: 500;
}

.chart-svg .grid-line {
    stroke: var(--line);
    stroke-width: 1;
}

.chart-svg .axis-zero {
    stroke: var(--line-strong);
    stroke-width: 1.5;
}

.chart-svg .guide {
    stroke: var(--muted);
    stroke-width: 1;
    stroke-dasharray: 3 3;
}

.legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
    font-size: 12px;
    color: var(--ink-2);
}

.legend span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
}

.swatch {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 2px;
    flex: none;
}

.tooltip {
    position: fixed;
    left: 0;
    top: 0;
    z-index: 50;
    pointer-events: none;
    background: var(--ink);
    color: var(--bg);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 12px;
    display: grid;
    gap: 3px;
    box-shadow: 0 4px 14px rgb(0 0 0 / 0.25);
    font-variant-numeric: tabular-nums;
}

.tip-line {
    display: flex;
    align-items: center;
    gap: 6px;
}

.pill {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 1px 8px;
    border-radius: 999px;
    letter-spacing: 0.02em;
}

.pill.good {
    background: var(--good-soft);
    color: var(--good);
}

.pill.warn {
    background: var(--warn-soft);
    color: var(--warn);
}

.pill.bad {
    background: var(--bad-soft);
    color: var(--bad);
}

.issues {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 6px;
}

.issues li {
    display: flex;
    gap: 10px;
    align-items: baseline;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface);
}

.foot {
    max-width: 1680px;
    margin: 28px auto 0;
    color: var(--muted);
    font-size: 12px;
}

@media (min-width: 1100px) {
    .layout {
        grid-template-columns: minmax(440px, 540px) minmax(0, 1fr);
    }

    .pane-form {
        position: sticky;
        top: 12px;
        max-height: calc(100vh - 24px);
        overflow-y: auto;
        padding-right: 6px;
    }
}

@media (max-width: 1099px) {
    .view-switch {
        display: inline-flex;
    }

    body[data-view='dati'] .pane-results,
    body[data-view='risultati'] .pane-form {
        display: none;
    }

    .selection-bar {
        position: static;
    }
}

@media (max-width: 520px) {
    .kpi-value {
        font-size: 21px;
    }

    .brand p {
        display: none;
    }
}

@media (prefers-reduced-motion: reduce) {
    * {
        scroll-behavior: auto !important;

<script>
'use strict';
// Calculation engine for mining project valuation (pure functions, no DOM).
// Money values share one unit (e.g. M US$), production shares one unit (e.g. Mlb), rates are fractions (0.08 = 8%).

const SCHEMA_VERSION = 1;

const toNumber = (value) => {
    const number = typeof value === 'number' ? value : Number.parseFloat(value);
    return Number.isFinite(number) ? number : 0;
};

const sum = (values) => values.reduce((total, value) => total + value, 0);

// Pads / truncates to `length` and coerces anything non-numeric to 0.
const fit = (values, length) => Array.from({ length }, (_, index) => toNumber(values?.[index]));

const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

const emptyProject = (startYear = 2028, yearsCount = 20) => ({
    schemaVersion: SCHEMA_VERSION,
    meta: {
        name: 'Nuovo progetto',
        company: '',
        commodity: 'Rame',
        productionUnit: 'kt',
        priceUnit: 'US$/t',
        currency: 'US$',
        moneyUnit: 'M US$',
    },
    years: Array.from({ length: yearsCount }, (_, index) => startYear + index),
    plan: {
        production: Array.from({ length: yearsCount }, () => 0),
        costLines: [
            { name: 'Miniera', variableShare: 0.7, values: Array.from({ length: yearsCount }, () => 0) },
            { name: 'Trattamento', variableShare: 0.85, values: Array.from({ length: yearsCount }, () => 0) },
            { name: 'Sito e G&A', variableShare: 0.25, values: Array.from({ length: yearsCount }, () => 0) },
            { name: 'Vendita e trasporto', variableShare: 1, values: Array.from({ length: yearsCount }, () => 0) },
        ],
        sustainingCapex: { variableShare: 0.8, values: Array.from({ length: yearsCount }, () => 0) },
        closureFund: Array.from({ length: yearsCount }, () => 0),
        workingCapital: Array.from({ length: yearsCount }, () => 0),
        initialCapex: Array.from({ length: yearsCount }, () => 0),
    },
    revenue: {
        prices: [100],
        realizationFactor: 1,
        realizationYears: 0,
        escalation: 0,
        royaltyRate: 0.03,
    },
    scenarios: [{ name: 'Piano base', production: null, additionalCapex: 0, efficiency: 1 }],
    tax: { rate: 0.3, holidayYears: 0, openingPool: 0 },
    capital: {
        remainingCapex: 0,
        companyShare: 1,
        capexShare: 1,
        cash: 0,
        debt: 0,
        debtFacility: 0,
        warrantProceeds: 0,
        includeWarrantProceedsInNav: true,
    },
    discount: { rates: [0.08, 0.1, 0.12], midYear: false, valuationYear: null },
    equity: {
        shares: 100,
        warrants: 0,
        sharePrice: 1,
        fx: 1,
        localCurrency: 'US$',
        peMultiples: [15, 20],
        averageYears: 0,
        referenceYear: null,
        investment: 10000,
    },
    otherAssets: [],
});

// Fills defaults and aligns every annual series to `years`, so imported or hand-edited projects never break the maths.
function normalizeProject(input) {
    const base = emptyProject();
    const years = (input.years?.length ? input.years : base.years).map((year) => Math.round(toNumber(year)));
    const length = years.length;
    const plan = input.plan ?? {};
    const costLines = (plan.costLines ?? base.plan.costLines).map((line) => ({
        name: String(line.name ?? 'Voce di costo'),
        variableShare: clamp(toNumber(line.variableShare), 0, 1),
        values: fit(line.values, length),
    }));
    const scenarios = (input.scenarios?.length ? input.scenarios : base.scenarios).map((scenario) => ({
        name: String(scenario.name ?? 'Scenario'),
        production: Array.isArray(scenario.production) ? fit(scenario.production, length) : null,
        additionalCapex: toNumber(scenario.additionalCapex),
        efficiency: scenario.efficiency === undefined || scenario.efficiency === null ? 1 : toNumber(scenario.efficiency),
    }));
    return {
        schemaVersion: SCHEMA_VERSION,
        meta: { ...base.meta, ...input.meta },
        years,
        plan: {
            production: fit(plan.production, length),
            costLines,
            sustainingCapex: {
                variableShare: clamp(toNumber(plan.sustainingCapex?.variableShare ?? base.plan.sustainingCapex.variableShare), 0, 1),
                values: fit(plan.sustainingCapex?.values, length),
            },
            closureFund: fit(plan.closureFund, length),
            workingCapital: fit(plan.workingCapital, length),
            initialCapex: fit(plan.initialCapex, length),
        },
        revenue: { ...base.revenue, ...input.revenue, prices: (input.revenue?.prices?.length ? input.revenue.prices : base.revenue.prices).map(toNumber) },
        scenarios,
        tax: { ...base.tax, ...input.tax },
        capital: { ...base.capital, ...input.capital },
        discount: { ...base.discount, ...input.discount, rates: (input.discount?.rates?.length ? input.discount.rates : base.discount.rates).map(toNumber) },
        equity: { ...base.equity, ...input.equity, peMultiples: (input.equity?.peMultiples?.length ? input.equity.peMultiples : base.equity.peMultiples).map(toNumber) },
        otherAssets: (input.otherAssets ?? []).map((asset) => ({ name: String(asset.name ?? 'Asset'), value: toNumber(asset.value), stake: clamp(toNumber(asset.stake ?? 1), 0, 1) })),
    };
}

// Plain-language problems the user should fix before trusting the numbers.
function validateProject(project) {
    const issues = [];
    const add = (level, message) => issues.push({ level, message });
    if (!project.plan.production.some((value) => value > 0)) {
        add('error', 'Il piano base non ha produzione: inserisci almeno un anno con produzione maggiore di zero.');
    }
    if (project.revenue.prices.length === 0 || project.revenue.prices.some((price) => price <= 0)) {
        add('error', 'Inserisci almeno un prezzo della materia prima maggiore di zero.');
    }
    if (project.equity.shares + project.equity.warrants <= 0) {
        add('warn', 'Le azioni in circolazione sono zero: i valori per azione non possono essere calcolati.');
    }
    if (project.capital.companyShare <= 0 || project.capital.companyShare > 1) {
        add('error', 'La quota della società nel progetto deve essere tra 0% e 100%.');
    }
    if (project.discount.rates.some((rate) => rate <= -1)) {
        add('error', 'Il tasso di sconto non è valido.');
    }
    if (project.revenue.royaltyRate < 0 || project.revenue.royaltyRate >= 1) {
        add('warn', 'La royalty dovrebbe essere una percentuale dei ricavi tra 0% e 100%.');
    }
    for (const scenario of project.scenarios) {
        if (scenario.production && !scenario.production.some((value) => value > 0)) {
            add('warn', `Lo scenario "${scenario.name}" non ha produzione: viene valutato a zero.`);
        }
    }
    return issues;
}

// Variable share of a cost scales with the production delta versus the base plan; the fixed share stays flat.
// `efficiency` (k) lets the extra volume cost less (<1) or more (>1) than the average unit cost.
const scaleWithProduction = (baseValues, baseProduction, production, variableShare, efficiency) =>
    baseValues.map((value, index) => {
        if (!(baseProduction[index] > 0)) {
            return value;
        }
        const delta = production[index] - baseProduction[index];
        return value + ((value * variableShare) / baseProduction[index]) * delta * efficiency;
    });

// Tax on the pre-tax cash flow: no tax during the holiday, an opening pool of deductible losses / allowances is used first,
// later losses are added to the pool.
function computeTax(preTaxCashFlow, tax) {
    let pool = Math.max(0, toNumber(tax.openingPool));
    const holiday = Math.max(0, Math.round(toNumber(tax.holidayYears)));
    return preTaxCashFlow.map((cashFlow, index) => {
        if (index < holiday) {
            return 0;
        }
        if (cashFlow <= 0) {
            pool -= cashFlow;
            return 0;
        }
        const used = Math.min(pool, cashFlow);
        pool -= used;
        return (cashFlow - used) * toNumber(tax.rate);
    });
}

function realizedPrices(project, price) {
    const { realizationFactor, realizationYears, escalation } = project.revenue;
    return project.years.map((_, index) => {
        const factor = index < realizationYears ? realizationFactor : 1;
        return price * (1 + escalation) ** index * factor;
    });
}

// One scenario at one commodity price: the full annual table down to attributable cash flow.
function simulate(project, scenario, price) {
    const { years, plan } = project;
    const length = years.length;
    const production = scenario.production ?? plan.production;
    const efficiency = scenario.efficiency ?? 1;

    let lastProductionIndex = -1;
    production.forEach((value, index) => {
        if (value > 0) {
            lastProductionIndex = index;
        }
    });
    // After the last producing year the mine is closed: no operating costs or capex.
    const alive = (values) => values.map((value, index) => (index <= lastProductionIndex ? value : 0));

    const prices = realizedPrices(project, price);
    const revenue = production.map((volume, index) => volume * prices[index]);
    const costLines = plan.costLines.map((line) => ({
        name: line.name,
        values: alive(scaleWithProduction(line.values, plan.production, production, line.variableShare, efficiency)),
    }));
    const royalty = revenue.map((value) => value * toNumber(project.revenue.royaltyRate));
    const operatingCost = years.map((_, index) => sum(costLines.map((line) => line.values[index])));
    const ebitda = years.map((_, index) => revenue[index] - operatingCost[index] - royalty[index]);
    const initialCapex = alive(plan.initialCapex);
    const sustainingCapex = alive(scaleWithProduction(plan.sustainingCapex.values, plan.production, production, plan.sustainingCapex.variableShare, efficiency));
    const closureFund = alive(plan.closureFund);
    const workingCapital = alive(plan.workingCapital);
    const preTaxCashFlow = years.map((_, index) => ebitda[index] - initialCapex[index] - sustainingCapex[index] - closureFund[index] - workingCapital[index]);
    const tax = computeTax(preTaxCashFlow, project.tax);
    const postTaxCashFlow = preTaxCashFlow.map((value, index) => value - tax[index]);
    // The company owns `companyShare` of the operating cash flow but pays `capexShare` of capex (a carried partner pays none).
    const { companyShare, capexShare } = project.capital;
    const attributableCashFlow = postTaxCashFlow.map((value, index) => companyShare * (value + initialCapex[index]) - capexShare * initialCapex[index]);

    return {
        years,
        price,
        production,
        prices,
        revenue,
        costLines,
        royalty,
        operatingCost,
        ebitda,
        initialCapex,
        sustainingCapex,
        closureFund,
        workingCapital,
        preTaxCashFlow,
        tax,
        postTaxCashFlow,
        attributableCashFlow,
        lifeYears: lastProductionIndex + 1,
        totals: {
            production: sum(production),
            revenue: sum(revenue),
            ebitda: sum(ebitda),
            preTaxCashFlow: sum(preTaxCashFlow),
            tax: sum(tax),
            postTaxCashFlow: sum(postTaxCashFlow),
            attributableCashFlow: sum(attributableCashFlow),
        },
        length,
    };
}

const discountFactors = (project, rate) => {
    const valuationYear = project.discount.valuationYear ?? project.years[0];
    const shift = project.discount.midYear ? 0.5 : 0;
    return project.years.map((year) => 1 / (1 + rate) ** (year - valuationYear + shift));
};

// NPV at one rate. Remaining capex is a lump sum at the valuation date (not discounted), as in the source model.
function npv(project, scenario, simulation, rate) {
    const factors = discountFactors(project, rate);
    const presentValue = (series) => sum(series.map((value, index) => value * factors[index]));
    const upfrontCapex = project.capital.remainingCapex + scenario.additionalCapex;
    const project100 = presentValue(simulation.postTaxCashFlow) - upfrontCapex;
    const attributable = presentValue(simulation.attributableCashFlow) - project.capital.capexShare * upfrontCapex;
    return { rate, upfrontCapex, project100, attributable };
}

const otherAssetsValue = (project) => sum(project.otherAssets.map((asset) => asset.value * asset.stake));

const fullyDilutedShares = (project) => project.equity.shares + project.equity.warrants;

// Cash-flow-per-share valuation: average and reference-year attributable cash flow, times each P/E multiple.
function perShare(project, simulation) {
    const { equity } = project;
    const shares = fullyDilutedShares(project);
    const flows = simulation.attributableCashFlow.slice(0, simulation.lifeYears);
    const window = equity.averageYears > 0 ? Math.min(equity.averageYears, flows.length) : flows.length;
    const meanCashFlow = window > 0 ? sum(flows.slice(0, window)) / window : 0;
    const referenceYear = equity.referenceYear ?? project.years[Math.min(1, project.years.length - 1)];
    const referenceIndex = project.years.indexOf(referenceYear);
    const referenceCashFlow = referenceIndex >= 0 ? simulation.attributableCashFlow[referenceIndex] : 0;
    const epsMean = shares > 0 ? meanCashFlow / shares : 0;
    const epsReference = shares > 0 ? referenceCashFlow / shares : 0;
    const price = equity.sharePrice;
    const targets = equity.peMultiples.map((multiple) => {
        const make = (eps) => {
            const target = eps * multiple;
            const multipleOfPrice = price > 0 ? target / price : 0;
            return { target, targetLocal: target * equity.fx, returnMultiple: multipleOfPrice, investmentValue: equity.investment * multipleOfPrice };
        };
        return { multiple, mean: make(epsMean), reference: make(epsReference) };
    });
    return { shares, window, referenceYear, meanCashFlow, referenceCashFlow, epsMean, epsReference, targets };
}

// Net asset value of the equity per share: NPV + other assets + cash - debt (+ warrant proceeds when warrants are in the share count).
function navBridge(project, attributableNpv) {
    const { capital, equity } = project;
    const other = otherAssetsValue(project);
    const warrantProceeds = capital.includeWarrantProceedsInNav && equity.warrants > 0 ? capital.warrantProceeds : 0;
    const equityValue = attributableNpv + other + capital.cash - capital.debt + warrantProceeds;
    const shares = fullyDilutedShares(project);
    const perShareValue = shares > 0 ? equityValue / shares : 0;
    const marketCap = equity.shares * equity.sharePrice;
    return {
        attributableNpv,
        other,
        cash: capital.cash,
        debt: capital.debt,
        warrantProceeds,
        equityValue,
        perShareValue,
        perShareLocal: perShareValue * equity.fx,
        marketCap,
        priceToNav: equityValue > 0 ? marketCap / equityValue : null,
        upside: equity.sharePrice > 0 ? perShareValue / equity.sharePrice - 1 : null,
    };
}

// Sources versus uses of funds before production (remaining capex and the scenario's extra capex).
function fundingCheck(project, scenario) {
    const { capital } = project;
    const uses = capital.remainingCapex + scenario.additionalCapex;
    const sources = capital.cash + capital.debtFacility + capital.warrantProceeds;
    return { uses, cash: capital.cash, debtFacility: capital.debtFacility, warrantProceeds: capital.warrantProceeds, sources, surplus: sources - uses };
}

// Every scenario x price x rate. `cases[scenarioIndex][priceIndex]` holds the simulation and its NPVs.
function runAll(project) {
    const rates = project.discount.rates;
    const cases = project.scenarios.map((scenario) =>
        project.revenue.prices.map((price) => {
            const simulation = simulate(project, scenario, price);
            const npvs = rates.map((rate) => npv(project, scenario, simulation, rate));
            return { scenario, price, simulation, npvs, perShare: perShare(project, simulation) };
        })
    );
    return { project, rates, prices: project.revenue.prices, scenarios: project.scenarios, cases, otherAssets: otherAssetsValue(project) };
}

// Expansion capex by the power-law rule: cost scales with (new capacity / old capacity) ^ exponent after escalation.
function estimateExpansionCapex({ items, capacityRatio, escalation, years }) {
    const rows = items.map((item) => {
        const escalated = toNumber(item.baseCost) * (1 + escalation) ** years;
        const scaled = escalated * capacityRatio ** toNumber(item.exponent);
        return { name: item.name, escalated, scaled, delta: scaled - escalated };
    });
    return { rows, total: sum(rows.map((row) => row.delta)) };
}

// Parses numbers typed or pasted in Italian or English notation: "1.234,5", "1234,5", "1,234.5", "12%".
function parseNumber(text) {
    if (typeof text === 'number') {
        return Number.isFinite(text) ? text : null;
    }
    let value = String(text ?? '')
        .trim()
        .replaceAll(/[\s %]/g, '');
    if (value === '' || value === '-') {
        return null;
    }
    const lastComma = value.lastIndexOf(',');
    const lastDot = value.lastIndexOf('.');
    if (lastComma !== -1 && lastDot !== -1) {
        value = lastComma > lastDot ? value.replaceAll('.', '').replace(',', '.') : value.replaceAll(',', '');
    } else if (lastComma !== -1) {
        value = value.replace(',', '.');
    }
    const number = Number(value);
    return Number.isFinite(number) ? number : null;
}

// ---------- small DOM and formatting helpers ----------

const appendChildren = (element, children) => {
    for (const child of children.flat(Infinity)) {
        if (child === null || child === undefined || child === false) {
            continue;
        }
        element.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
};

const h = (tag, attributes = {}, ...children) => {
    const element = document.createElement(tag);
    for (const [name, value] of Object.entries(attributes)) {
        if (value === undefined || value === null || value === false) {
            continue;
        }
        if (name === 'class') {
            element.className = value;
        } else if (name === 'text') {
            element.textContent = value;
        } else if (name === 'value') {
            element.value = value;
        } else if (name.startsWith('on')) {
            element.addEventListener(name.slice(2), value);
        } else {
            element.setAttribute(name, value === true ? '' : value);
        }
    }
    appendChildren(element, children);
    return element;
};

    }
    appendChildren(element, children);
    return element;
};

const formatters = new Map();
const fmt = (value, digits = 0) => {
    if (value === null || value === undefined || !Number.isFinite(value)) {
        return '–';
    }
    if (!formatters.has(digits)) {
        formatters.set(digits, new Intl.NumberFormat('it-IT', { minimumFractionDigits: digits, maximumFractionDigits: digits }));
    }
    const text = formatters.get(digits).format(value);
    return text === '-0' ? '0' : text;
};
const fmtPct = (value, digits = 0) => (value === null || value === undefined || !Number.isFinite(value) ? '–' : `${fmt(value * 100, digits)}%`);
const fmtSigned = (value, digits = 0) => (Number.isFinite(value) ? `${value > 0 ? '+' : ''}${fmt(value, digits)}` : '–');
const fmtInput = (value) => (Number.isFinite(value) ? String(Math.round(value * 1e6) / 1e6).replace('.', ',') : '');
const fmtPctInput = (value) => (Number.isFinite(value) ? String(Math.round(value * 1e8) / 1e6).replace('.', ',') : '');
const parseList = (text) =>
    String(text)
        .split(/[\s;]+/)
        .map((part) => parseNumber(part))
        .filter((value) => value !== null);
const clampInt = (value, min, max) => Math.min(max, Math.max(min, Math.round(value)));

const resizeYears = (startYear, count) => {
    const length = clampInt(count, 1, MAX_YEARS);
    const fit = (values) => Array.from({ length }, (_, index) => values?.[index] ?? 0);
    project.years = Array.from({ length }, (_, index) => startYear + index);
    const { plan } = project;
    plan.production = fit(plan.production);
    for (const line of plan.costLines) {
        line.values = fit(line.values);
    }
    plan.sustainingCapex.values = fit(plan.sustainingCapex.values);
    plan.closureFund = fit(plan.closureFund);
    plan.workingCapital = fit(plan.workingCapital);
    plan.initialCapex = fit(plan.initialCapex);
    for (const scenario of project.scenarios) {
        if (scenario.production) {
            scenario.production = fit(scenario.production);
        }
    }
};

const scalarField = ({ label, hint, get, set, kind = 'number', suffix, wide }) => {
    const toDisplay = () => {
        const value = get();
        if (kind === 'text') {
            return value ?? '';
        }
        if (kind === 'list') {
            return value.map(fmtInput).join(' ');
        }
        if (kind === 'percentList') {
            return value.map(fmtPctInput).join(' ');
        }
        return kind === 'percent' ? fmtPctInput(value) : fmtInput(value);
    };
    const input = h('input', { type: 'text', inputmode: kind === 'text' ? 'text' : 'decimal', value: toDisplay(), autocomplete: 'off', spellcheck: 'false' });
    input.addEventListener('change', () => {
        if (kind === 'text') {
            set(input.value.trim());
        } else if (kind === 'list' || kind === 'percentList') {
            const values = parseList(input.value);
            if (values.length > 0) {
                set(kind === 'percentList' ? values.map((value) => value / 100) : values);
            }
        } else {
            const number = parseNumber(input.value);
            if (number !== null) {
                set(kind === 'percent' ? number / 100 : number);
            }
        }
        input.value = toDisplay();
        recalc();
    });
    input.addEventListener('focus', () => input.select());
    return h(
        'label',
        { class: `field${wide ? ' field-wide' : ''}` },
        h('span', { class: 'field-label', text: label }),
        h('span', { class: 'field-control' }, input, suffix ? h('span', { class: 'field-suffix', text: suffix }) : null),
        hint ? h('span', { class: 'field-hint', text: hint }) : null
    );
};

const checkField = ({ label, hint, get, set }) => {
    const input = h('input', { type: 'checkbox' });
    input.checked = Boolean(get());
    input.addEventListener('change', () => {
        set(input.checked);
        recalc();
    });
    return h('label', { class: 'check' }, input, h('span', {}, h('span', { class: 'field-label', text: label }), hint ? h('span', { class: 'field-hint', text: hint }) : null));
};

// ---------- editable table (years down, series across) with paste from Excel ----------

const buildGrid = ({ columns, footer = true }) => {
    const rowCount = project.years.length;
    const inputs = [];
    const footerCells = [];

    const refresh = () => {
        for (const entry of inputs) {
            entry.input.value = fmtInput(columns[entry.col].get(entry.row));
        }
        columns.forEach((column, index) => {
            if (footerCells[index]) {
                footerCells[index].textContent = fmt(sum(project.years.map((_, row) => column.get(row))), 2);
            }
        });
    };

    const applyPaste = (text, startRow, startCol) => {
        let matrix = text
            .trim()
            .split(/\r?\n/)
            .map((line) => line.split('\t'));
        // One pasted row (years across in Excel) is laid out down the column.
        if (matrix.length === 1 && matrix[0].length > 1) {
            matrix = matrix[0].map((cell) => [cell]);
        }
        matrix.forEach((cells, rowOffset) => {
            cells.forEach((cell, colOffset) => {
                const row = startRow + rowOffset;
                const col = startCol + colOffset;
                const value = parseNumber(cell);
                if (value !== null && row < rowCount && col < columns.length) {
                    columns[col].set(row, value);
                }
            });
        });
        refresh();
        recalc();
    };

    const head = h(
        'tr',
        {},
        h('th', { class: 'sticky-col', text: 'Anno' }),
        columns.map((column) => h('th', {}, h('span', { class: 'th-title', text: column.header }), column.sub ?? null))
    );
    const body = project.years.map((year, row) =>
        h(
            'tr',
            {},
            h('th', { class: 'sticky-col year', scope: 'row', text: String(year) }),
            columns.map((column, col) => {
                const input = h('input', { type: 'text', inputmode: 'decimal', value: fmtInput(column.get(row)), 'aria-label': `${column.header} ${year}`, autocomplete: 'off' });
                input.addEventListener('change', () => {
                    const value = parseNumber(input.value);
                    if (value !== null) {
                        column.set(row, value);
                    }
                    refresh();
                    recalc();
                });
                input.addEventListener('focus', () => input.select());
                input.addEventListener('paste', (event) => {
                    const text = event.clipboardData?.getData('text') ?? '';
                    if (/[\t\n]/.test(text.trim())) {
                        event.preventDefault();
                        applyPaste(text, row, col);
                    }
                });
                input.addEventListener('keydown', (event) => {
                    const move = { Enter: 1, ArrowDown: 1, ArrowUp: -1 }[event.key];
                    if (move) {
                        event.preventDefault();
                        input.dispatchEvent(new Event('change'));
                        inputs.find((entry) => entry.row === row + move && entry.col === col)?.input.focus();
                    }
                });
                inputs.push({ input, row, col });
                return h('td', {}, input);
            })
        )
    );
    const foot = footer
        ? h(
              'tr',
              { class: 'grid-total' },
              h('th', { class: 'sticky-col', text: 'Totale' }),
              columns.map((_, index) => {
                  const cell = h('td', {});
                  footerCells[index] = cell;
                  return cell;
              })
          )
        : null;
    const table = h('table', { class: 'grid' }, h('thead', {}, head), h('tbody', {}, body), foot ? h('tfoot', {}, foot) : null);
    refresh();
    return h('div', { class: 'table-scroll' }, table);
};

const compactInput = ({ get, set, kind = 'percent', label }) => {
    const input = h('input', { type: 'text', inputmode: 'decimal', value: kind === 'percent' ? fmtPctInput(get()) : fmtInput(get()), 'aria-label': label, autocomplete: 'off' });
    input.addEventListener('change', () => {
        const number = parseNumber(input.value);
        if (number !== null) {
            set(kind === 'percent' ? Math.min(1, Math.max(0, number / 100)) : number);
        }
        input.value = kind === 'percent' ? fmtPctInput(get()) : fmtInput(get());
        recalc();
    });
    input.addEventListener('focus', () => input.select());
    return h('span', { class: 'th-sub' }, h('span', { text: 'quota variabile' }), h('span', { class: 'field-control mini' }, input, h('span', { class: 'field-suffix', text: '%' })));
};

// ---------- charts ----------

const niceScale = (min, max, target = 5) => {
    const lo = Math.min(min, 0);
    const hi = Math.max(max, 0);
    const span = hi - lo || 1;
    const rough = span / target;
    const magnitude = 10 ** Math.floor(Math.log10(rough));
    const step = [1, 2, 2.5, 5, 10].map((factor) => factor * magnitude).find((candidate) => candidate >= rough) ?? 10 * magnitude;
    const start = Math.floor(lo / step) * step;
    const end = Math.ceil(hi / step) * step === start ? start + step : Math.ceil(hi / step) * step;
    const ticks = [];
    for (let value = start; value <= end + step / 2; value += step) {
        ticks.push(Math.abs(value) < step / 1e6 ? 0 : value);
    }
    return { min: start, max: end, ticks };
};

const tooltip = h('div', { class: 'tooltip', role: 'tooltip', hidden: true });
const showTooltip = (event, lines) => {
    tooltip.replaceChildren(...lines.map((line) => h('div', { class: 'tip-row' }, line)));
    tooltip.hidden = false;
    const margin = 12;
    const box = tooltip.getBoundingClientRect();
    const x = Math.min(event.clientX + margin, window.innerWidth - box.width - margin);
    const y = event.clientY + margin + box.height > window.innerHeight ? event.clientY - box.height - margin : event.clientY + margin;
    tooltip.style.transform = `translate(${Math.max(margin / 2, x)}px, ${Math.max(margin / 2, y)}px)`;
};
const hideTooltip = () => {
    tooltip.hidden = true;
};

const seriesColor = (index) => `var(--s${(index % 8) + 1})`;

// Charts are drawn at the width they are shown, so text stays readable on phones.
const chartWidth = () => {
    const pane = resultsRoot.clientWidth || 900;
    const columns = pane >= 880 ? 2 : 1;
    return Math.round(Math.min(720, Math.max(290, (pane - 14 * (columns - 1)) / columns - 34)));
};

const lineChart = ({ title, xLabels, series, yUnit }) => {
    const width = chartWidth();
    const height = Math.round(Math.min(300, width * 0.62));
    const labelled = series.length <= 4 && width >= 480;
    const margin = { top: 14, right: labelled ? 112 : 18, bottom: 34, left: width >= 480 ? 62 : 52 };
    const plotWidth = width - margin.left - margin.right;
    const plotHeight = height - margin.top - margin.bottom;
    const values = series.flatMap((entry) => entry.values);
    const scale = niceScale(Math.min(...values), Math.max(...values));
    const x = (index) => margin.left + (xLabels.length === 1 ? plotWidth / 2 : (index / (xLabels.length - 1)) * plotWidth);
    const y = (value) => margin.top + plotHeight - ((value - scale.min) / (scale.max - scale.min)) * plotHeight;

    const svg = s('svg', { viewBox: `0 0 ${width} ${height}`, role: 'img', 'aria-label': title, class: 'chart-svg' });
    for (const tick of scale.ticks) {
        svg.append(
            s('line', { x1: margin.left, x2: width - margin.right, y1: y(tick), y2: y(tick), class: tick === 0 ? 'axis-zero' : 'grid-line' }),
            s('text', { x: margin.left - 8, y: y(tick) + 4, 'text-anchor': 'end', class: 'tick' }, fmt(tick))
        );
    }
    xLabels.forEach((label, index) => svg.append(s('text', { x: x(index), y: height - 12, 'text-anchor': 'middle', class: 'tick' }, label)));
    series.forEach((entry, seriesIndex) => {
        const points = entry.values.map((value, index) => `${x(index)},${y(value)}`).join(' ');
        svg.append(s('polyline', { points, fill: 'none', stroke: seriesColor(seriesIndex), 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
    });
    series.forEach((entry, seriesIndex) => {
        entry.values.forEach((value, index) => svg.append(s('circle', { cx: x(index), cy: y(value), r: 4, fill: seriesColor(seriesIndex), stroke: 'var(--surface)', 'stroke-width': 2 })));
    });
    if (labelled) {
        // Direct labels at the right end, nudged apart so they never overlap.
        const labels = series.map((entry, index) => ({ entry, index, y: y(entry.values.at(-1)) })).sort((a, b) => a.y - b.y);
        labels.forEach((label, order) => {
            if (order > 0 && label.y - labels[order - 1].y < 13) {
                label.y = labels[order - 1].y + 13;
            }
            svg.append(s('text', { x: width - margin.right + 10, y: label.y + 4, class: 'direct-label' }, label.entry.name));
        });
    }
    const guide = s('line', { y1: margin.top, y2: margin.top + plotHeight, class: 'guide', visibility: 'hidden' });
    const hit = s('rect', { x: margin.left, y: margin.top, width: plotWidth, height: plotHeight, fill: 'transparent' });
    const move = (event) => {
        const box = svg.getBoundingClientRect();
        const px = ((event.clientX - box.left) / box.width) * width;
        const index = Math.min(xLabels.length - 1, Math.max(0, Math.round(((px - margin.left) / plotWidth) * (xLabels.length - 1))));
        guide.setAttribute('x1', x(index));
        guide.setAttribute('x2', x(index));
        guide.setAttribute('visibility', 'visible');
        showTooltip(event, [
            h('strong', { text: xLabels[index] }),
            ...series.map((entry, seriesIndex) => h('span', { class: 'tip-line' }, h('i', { class: 'swatch', style: `background:${seriesColor(seriesIndex)}` }), `${entry.name}: ${fmt(entry.values[index])} ${yUnit}`)),
        ]);
    };
    hit.addEventListener('pointermove', move);
    hit.addEventListener('pointerleave', () => {
        guide.setAttribute('visibility', 'hidden');
        hideTooltip();
    });
    svg.append(guide, hit);
    return svg;
};

const barPath = (x0, w, yZero, yValue, radius) => {
    const top = Math.min(yZero, yValue);
    const bottom = Math.max(yZero, yValue);
    const r = Math.min(radius, w / 2, bottom - top);
    if (yValue <= yZero) {
        return `M${x0},${bottom} V${top + r} Q${x0},${top} ${x0 + r},${top} H${x0 + w - r} Q${x0 + w},${top} ${x0 + w},${top + r} V${bottom} Z`;
    }
    return `M${x0},${top} V${bottom - r} Q${x0},${bottom} ${x0 + r},${bottom} H${x0 + w - r} Q${x0 + w},${bottom} ${x0 + w},${bottom - r} V${top} Z`;
};

const barChart = ({ title, labels, values, unit, name }) => {
    const width = chartWidth();
    const height = Math.round(Math.min(280, width * 0.56));
    const margin = { top: 12, right: 12, bottom: 30, left: width >= 480 ? 62 : 52 };
    const plotWidth = width - margin.left - margin.right;
    const plotHeight = height - margin.top - margin.bottom;
    const scale = niceScale(Math.min(...values), Math.max(...values));
    const band = plotWidth / values.length;
    const barWidth = Math.max(2, Math.min(28, band * 0.7));
    const y = (value) => margin.top + plotHeight - ((value - scale.min) / (scale.max - scale.min)) * plotHeight;
    const every = Math.ceil(values.length / Math.max(4, Math.floor(plotWidth / 52)));

    const svg = s('svg', { viewBox: `0 0 ${width} ${height}`, role: 'img', 'aria-label': title, class: 'chart-svg' });
    for (const tick of scale.ticks) {
        svg.append(
            s('line', { x1: margin.left, x2: width - margin.right, y1: y(tick), y2: y(tick), class: tick === 0 ? 'axis-zero' : 'grid-line' }),
            s('text', { x: margin.left - 8, y: y(tick) + 4, 'text-anchor': 'end', class: 'tick' }, fmt(tick))
        );
    }
    values.forEach((value, index) => {
        const x0 = margin.left + index * band + (band - barWidth) / 2;
        if (value !== 0) {
            svg.append(s('path', { d: barPath(x0, barWidth, y(0), y(value), 4), fill: 'var(--s1)' }));
        }
        if (index % every === 0) {
            svg.append(s('text', { x: x0 + barWidth / 2, y: height - 10, 'text-anchor': 'middle', class: 'tick' }, labels[index]));
        }
        const hit = s('rect', { x: margin.left + index * band, y: margin.top, width: band, height: plotHeight, fill: 'transparent' });
        hit.addEventListener('pointermove', (event) => showTooltip(event, [h('strong', { text: labels[index] }), `${name}: ${fmt(value, 1)} ${unit}`]));
        hit.addEventListener('pointerleave', hideTooltip);
        svg.append(hit);
    });
    return svg;
};

const perShareSection = () => {
    const { equity, meta } = project;
    const priceHeads = project.revenue.prices.map((price) => h('th', { class: 'num', text: fmt(price, 2) }));
    const scenarioCases = results.cases[ui.scenario];
    const blocks = equity.peMultiples.map((multiple, multipleIndex) => {
        const row = (label, pick, digits = 2) =>
            h(
                'tr',
                {},
                h('th', { scope: 'row', text: label }),
                scenarioCases.map((entry) => h('td', { class: 'num', text: fmt(pick(entry.perShare.targets[multipleIndex], entry.perShare), digits) }))
            );
        return h(
            'div',
            { class: 'table-scroll' },
            h(
                'table',
                { class: 'matrix' },
                h('thead', {}, h('tr', {}, h('th', { text: `P/E ${fmt(multiple)}` }), priceHeads)),
                h(
                    'tbody',
                    {},
                    row('EPS medio', (_, shares) => shares.epsMean, 3),
                    row(`Target su EPS medio (${meta.currency})`, (target) => target.mean.target),
                    row(`Target su EPS medio (${equity.localCurrency})`, (target) => target.mean.targetLocal),
                    row('Rendimento atteso (×)', (target) => target.mean.returnMultiple, 1),
                    row(`${fmt(equity.investment)} investiti diventano`, (target) => target.mean.investmentValue, 0),
                    h('tr', { class: 'sep' }, h('th', { colspan: String(project.revenue.prices.length + 1), text: `Sull’EPS dell’anno di riferimento (${scenarioCases[0].perShare.referenceYear})` })),
                    row(`EPS ${scenarioCases[0].perShare.referenceYear}`, (_, shares) => shares.epsReference, 3),
                    row(`Target su EPS ${scenarioCases[0].perShare.referenceYear} (${meta.currency})`, (target) => target.reference.target),
                    row(`Target su EPS ${scenarioCases[0].perShare.referenceYear} (${equity.localCurrency})`, (target) => target.reference.targetLocal),
                    row('Rendimento atteso (×)', (target) => target.reference.returnMultiple, 1),
                    row(`${fmt(equity.investment)} investiti diventano`, (target) => target.reference.investmentValue, 0)
                )
            )
        );
    });
    const first = scenarioCases[0].perShare;
    return card(
        `Valore per azione · ${project.scenarios[ui.scenario].name}`,
        `EPS = flusso di cassa post tasse della società ÷ ${fmt(first.shares)} milioni di azioni diluite. EPS medio sui primi ${first.window} anni. Rendimento atteso = target ÷ prezzo attuale (${fmt(equity.sharePrice, 2)} ${meta.currency}). Colonne: prezzo in ${meta.priceUnit}.`,
        h('div', { class: 'matrix-set' }, blocks)
    );
};

const navSection = () => {
    const { meta } = project;
    const current = selectedCase();
    const columns = project.scenarios.map((scenario, index) => {
        const entry = results.cases[index][ui.price];
        const nav = navBridge(project, entry.npvs[ui.rate].attributable);
        return { scenario, nav, funding: fundingCheck(project, scenario) };
    });
    const row = (label, pick, digits = 0, className = '') =>
        h(
            'tr',
            { class: className },
            h('th', { scope: 'row', text: label }),
            columns.map((column) => h('td', { class: 'num', text: pick(column) === null ? '–' : fmt(pick(column), digits) }))
        );
    return h(
        'div',
        { class: 'chart-pair' },
        card(
            `NAV per azione a ${fmt(current.price, 2)} ${meta.priceUnit} e ${fmtPct(project.discount.rates[ui.rate], 1)}`,
            'Valore netto del patrimonio: NPV della società + altri asset + cassa − debito (+ incassi dei warrant). Metrica aggiuntiva rispetto al modello Excel.',
            h(
                'div',
                { class: 'table-scroll' },
                h(
                    'table',
                    { class: 'matrix' },
                    h(
                        'thead',
                        {},
                        h(
                            'tr',
                            {},
                            h('th', { text: meta.moneyUnit }),
                            columns.map((column) => h('th', { class: 'num', text: column.scenario.name }))
                        )
                    ),
                    h(
                        'tbody',
                        {},
                        row('NPV quota società', (c) => c.nav.attributableNpv),
                        row('+ Altri asset (JV)', (c) => c.nav.other),
                        row('+ Cassa', (c) => c.nav.cash),
                        row('− Debito', (c) => -c.nav.debt),
                        row('+ Incassi warrant', (c) => c.nav.warrantProceeds),
                        row('Valore del patrimonio', (c) => c.nav.equityValue, 0, 'total'),
                        row(`NAV per azione (${meta.currency})`, (c) => c.nav.perShareValue, 2, 'total'),
                        row('Capitalizzazione attuale', (c) => c.nav.marketCap),
                        row('Prezzo / NAV', (c) => c.nav.priceToNav, 2)
                    )
                )
            )
        ),
        card(
            'Controllo del finanziamento',
            'Fonti disponibili meno il capex da pagare prima di produrre.',
            h(
                'div',
                { class: 'table-scroll' },
                h(
                    'table',
                    { class: 'matrix' },
                    h(
                        'thead',
                        {},
                        h(
                            'tr',
                            {},
                            h('th', { text: meta.moneyUnit }),
                            columns.map((column) => h('th', { class: 'num', text: column.scenario.name }))
                        )
                    ),
                    h(
                        'tbody',
                        {},
                        row('Capex da finanziare', (c) => c.funding.uses),
                        row('Cassa', (c) => c.funding.cash),
                        row('Linea di credito', (c) => c.funding.debtFacility),
                        row('Incassi warrant', (c) => c.funding.warrantProceeds),
                        row('Fonti totali', (c) => c.funding.sources, 0, 'total'),
                        h(
                            'tr',
                            { class: 'total' },
                            h('th', { scope: 'row', text: 'Avanzo / (fabbisogno)' }),
                            columns.map((column) => h('td', { class: 'num' }, `${fmt(column.funding.surplus)} `, column.funding.surplus >= 0 ? pill('good', 'coperto') : pill('bad', 'scoperto')))
                        )
                    )
                )
            )
        )
    );
};

const annualSection = () => {
    const current = selectedCase();
    const { simulation } = current;
    const factors = discountFactors(project, project.discount.rates[ui.rate]);
    const lines = [
        { label: `Produzione (${project.meta.productionUnit})`, values: simulation.production, digits: 2 },
        { label: `Prezzo realizzato (${project.meta.priceUnit})`, values: simulation.prices, digits: 2, total: false },
        { label: 'Ricavi', values: simulation.revenue, strong: true },
        ...simulation.costLines.map((line) => ({ label: line.name, values: line.values })),
        { label: 'Royalty', values: simulation.royalty },
        { label: 'EBITDA', values: simulation.ebitda, strong: true },
        { label: 'Capex di sviluppo', values: simulation.initialCapex },
        { label: 'Capex di sostenimento', values: simulation.sustainingCapex },
        { label: 'Fondo di chiusura', values: simulation.closureFund },
        { label: 'Capitale circolante', values: simulation.workingCapital },
        { label: 'Flusso ante tasse', values: simulation.preTaxCashFlow, strong: true },
        { label: 'Tasse', values: simulation.tax },
        { label: 'Flusso post tasse (progetto 100%)', values: simulation.postTaxCashFlow, strong: true },
        { label: 'Flusso quota società', values: simulation.attributableCashFlow, strong: true },
        { label: 'Fattore di sconto', values: factors, digits: 3, total: false },
        { label: 'Flusso società scontato', values: simulation.attributableCashFlow.map((value, index) => value * factors[index]) },
    ];
    const header = h(
        'tr',
        {},
        h('th', { class: 'sticky-col', text: '' }),
        h('th', { class: 'num', text: 'Totale' }),
        project.years.map((year) => h('th', { class: 'num', text: String(year) }))
    );
    const body = lines.map((line) =>
        h(
            'tr',
            { class: line.strong ? 'total' : '' },
            h('th', { class: 'sticky-col', scope: 'row', text: line.label }),
            h('td', { class: 'num', text: line.total === false ? '' : fmt(sum(line.values), line.digits ?? 1) }),
            line.values.map((value) => h('td', { class: 'num', text: fmt(value, line.digits ?? 1) }))
        )
    );
    return card(
        `Dettaglio annuale · ${project.scenarios[ui.scenario].name} a ${fmt(current.price, 2)} ${project.meta.priceUnit}`,
        `Valori in ${project.meta.moneyUnit}. Sconto al ${fmtPct(project.discount.rates[ui.rate], 1)}.`,
        h('div', { class: 'table-scroll' }, h('table', { class: 'matrix annual' }, h('thead', {}, header), h('tbody', {}, body)))
    );
};

const csvEscape = (value) => `"${String(value).replaceAll('"', '""')}"`;
const csvNumber = (value) => (Number.isFinite(value) ? String(Math.round(value * 1e6) / 1e6).replace('.', ',') : '');

const buildCsv = () => {
    const lines = [
        [
            'Scenario',
            'Prezzo',
            'Tasso di sconto %',
            'NPV progetto 100%',
            'NPV quota società',
            'NPV quota società + altri asset',
            'NAV per azione',
            'EPS medio',
            ...project.equity.peMultiples.map((multiple) => `Target P/E ${multiple} su EPS medio`),
        ]
            .map(csvEscape)
            .join(';'),
    ];
    results.cases.forEach((row) =>
        row.forEach((entry) =>
            entry.npvs.forEach((result) => {
                const nav = navBridge(project, result.attributable);
                lines.push(
                    [
                        csvEscape(entry.scenario.name),
                        csvNumber(entry.price),
                        csvNumber(result.rate * 100),
                        csvNumber(result.project100),
                        csvNumber(result.attributable),
                        csvNumber(result.attributable + results.otherAssets),
                        csvNumber(nav.perShareValue),
                        csvNumber(entry.perShare.epsMean),
                        ...entry.perShare.targets.map((target) => csvNumber(target.mean.target)),
                    ].join(';')
                );
            })
        )
    );
    return `﻿${lines.join('\r\n')}`;
};

const resultsRoot = h('div', { class: 'results-inner' });

function renderResults() {
    if (!results) {
        return;
    }
    const warnings = warningsBlock();
    const hasError = validateProject(project).some((issue) => issue.level === 'error');
    resultsRoot.replaceChildren(
        ...[
            warnings,
            hasError ? null : h('div', { class: 'selection-bar' }, selectRow()),
            hasError ? null : kpiStrip(),
            hasError ? null : matrixSection(),
            hasError ? null : chartSection(),
            hasError ? null : perShareSection(),
            hasError ? null : navSection(),
            hasError ? null : annualSection(),
        ].filter(Boolean)
    );
}

// ---------- shell: header, tabs, import / export ----------

const formRoot = h('div', { class: 'form-inner' });
const status = h('span', { class: 'status', role: 'status' });
let statusTimer;
const flash = (message) => {
    status.textContent = message;
    clearTimeout(statusTimer);
    statusTimer = setTimeout(() => (status.textContent = ''), 3500);
};

function renderForm() {
    const tabs = h(
        'div',
        { class: 'tabs', role: 'tablist' },
        TABS.map((tab) => h('button', { type: 'button', role: 'tab', class: ui.tab === tab.id ? 'on' : '', 'aria-selected': String(ui.tab === tab.id), text: tab.label, onclick: () => ((ui.tab = tab.id), renderForm()) }))
    );
    const scrollTop = document.scrollingElement?.scrollTop ?? 0;
    formRoot.replaceChildren(tabs, tabBuilders[ui.tab]());
    if (document.scrollingElement) {
        document.scrollingElement.scrollTop = scrollTop;
    }
}

const copyText = async (text, successMessage) => {
    try {
        await navigator.clipboard.writeText(text);
        flash(successMessage);
    } catch {
        const area = h('textarea', { class: 'sr-fallback', readonly: true }, text);
        document.body.append(area);
        area.select();
        const copied = document.execCommand?.('copy');
        area.remove();
        flash(copied ? successMessage : 'Copia non riuscita: usa «Scarica».');
    }
};

const download = (filename, text, type) => {
    const url = URL.createObjectURL(new Blob([text], { type }));
    const link = h('a', { href: url, download: filename });
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
};

const safeName = () =>
    (project.meta.name || 'progetto')
        .toLowerCase()
        .replaceAll(/[^a-z0-9]+/g, '-')
        .replaceAll(/^-|-$/g, '') || 'progetto';

const loadFromText = (text) => {
    try {
        const parsed = JSON.parse(text);
        if (!parsed || typeof parsed !== 'object' || !parsed.plan) {
            throw new Error('formato');
        }
        setProject(parsed);
        flash('Progetto caricato.');
        return true;
    } catch {
        flash('File non valido: serve un progetto salvato da questo programma (.json).');
        return false;
    }
};

const pastePanel = h(
    'div',
    { class: 'paste-panel', hidden: true },
    h('textarea', { id: 'paste-json', rows: '6', placeholder: 'Incolla qui il JSON del progetto', 'aria-label': 'JSON del progetto' }),
    h(
        'div',
        { class: 'row' },
        h('button', { type: 'button', class: 'btn small', text: 'Carica', onclick: () => loadFromText(document.getElementById('paste-json').value) && (pastePanel.hidden = true) }),
        h('button', { type: 'button', class: 'btn ghost small', text: 'Chiudi', onclick: () => (pastePanel.hidden = true) })
    )
);

const fileInput = h('input', {
    type: 'file',
    accept: '.json,application/json',
    hidden: true,
    onchange: async (event) => {
        const file = event.target.files?.[0];
        if (file) {
            loadFromText(await file.text());
        }
        event.target.value = '';
    },
});

const toolbar = () =>
    h(
        'div',
        { class: 'toolbar' },
        h('button', { type: 'button', class: 'btn ghost small', text: 'Esempio Dasa', onclick: () => (setProject(EXAMPLE_PROJECT), flash('Caricato l’esempio dal modello Excel.')) }),
        h('button', { type: 'button', class: 'btn ghost small', text: 'Nuovo progetto', onclick: () => (setProject(emptyProject()), flash('Progetto vuoto: compila le schede.')) }),
        h('button', { type: 'button', class: 'btn ghost small', text: 'Apri file…', onclick: () => fileInput.click() }),
        h('button', { type: 'button', class: 'btn ghost small', text: 'Incolla JSON…', onclick: () => (pastePanel.hidden = !pastePanel.hidden) }),
        h('span', { class: 'toolbar-sep' }),
        CAN_DOWNLOAD && h('button', { type: 'button', class: 'btn small', text: 'Scarica progetto', onclick: () => download(`${safeName()}.json`, JSON.stringify(project, null, 1), 'application/json') }),
        h('button', { type: 'button', class: 'btn ghost small', text: 'Copia JSON', onclick: () => copyText(JSON.stringify(project, null, 1), 'Progetto copiato negli appunti.') }),
        CAN_DOWNLOAD && h('button', { type: 'button', class: 'btn ghost small', text: 'Scarica risultati (CSV)', onclick: () => download(`${safeName()}-risultati.csv`, buildCsv(), 'text/csv') }),
        h('button', { type: 'button', class: 'btn ghost small', text: 'Copia risultati (CSV)', onclick: () => copyText(buildCsv(), 'Risultati copiati: incollali in Excel.') })
    );

const viewSwitch = h(
    'div',
    { class: 'segmented view-switch', role: 'group', 'aria-label': 'Vista' },
    [
        ['dati', 'Dati'],
        ['risultati', 'Risultati'],
    ].map(([value, label]) =>
        h('button', {
            type: 'button',
            'data-view': value,
            class: ui.view === value ? 'on' : '',
            text: label,
            onclick: () => {
                ui.view = value;
                document.body.dataset.view = value;
                for (const button of viewSwitch.querySelectorAll('button')) {
                    button.classList.toggle('on', button.dataset.view === value);
                }
                window.scrollTo(0, 0);
            },
        })
    )
);

const mount = () => {
    let stored = null;
    try {
        stored = localStorage.getItem(STORAGE_KEY);
    } catch {
        stored = null;
    }
    let initial = EXAMPLE_PROJECT;
    if (stored) {
        try {
            initial = JSON.parse(stored);
        } catch {
            initial = EXAMPLE_PROJECT;
        }
    }
    project = normalizeProject(initial);
    document.body.dataset.view = ui.view;
    const app = document.getElementById('app');
    app.append(
        h(
            'header',
            { class: 'topbar' },
            h(
                'div',
                { class: 'brand' },
                s('svg', { class: 'mark', viewBox: '0 0 24 24', 'aria-hidden': 'true' }),
                h('div', {}, h('h1', { text: 'Simulatore Valore Minerario' }), h('p', { text: 'NPV, valore per azione e scenari di espansione per progetti estrattivi' }))
            ),
            viewSwitch
        ),
        h('div', { class: 'toolbar-wrap' }, toolbar(), status),
        pastePanel,
        fileInput,
        h('main', { class: 'layout' }, h('div', { class: 'pane pane-form' }, formRoot), h('div', { class: 'pane pane-results' }, resultsRoot)),
        h('footer', { class: 'foot', text: 'Le stime sono modelli semplificati a scopo di analisi: non sono consigli di investimento. I dati restano nel tuo browser.' }),
        tooltip
    );
    const mark = app.querySelector('.mark');
    for (const [index, y] of [5, 10, 15, 20].entries()) {
        mark.append(s('rect', { x: 2 + index, y: y - 3, width: 20 - index * 2, height: 3, rx: 1, fill: 'currentColor', opacity: String(1 - index * 0.2) }));
    }
    renderForm();
    recalc();
};

mount();

// Redraw the charts when the layout switches between one and two columns, or the phone rotates.
let lastChartWidth = chartWidth();
let resizeTimer;
window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
        const width = chartWidth();
        if (width !== lastChartWidth) {
            lastChartWidth = width;
            renderResults();
        }
    }, 150);
});

</script>
